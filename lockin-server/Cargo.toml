[package]
name = "lockin-server"
version = "0.1.0"
edition = "2024"

[dependencies]
lockin-core = { path = "../lockin-core" }
lockin-proto = { path = "../lockin-proto" }
tokio = { version = "1.0", features = ["full"] }
mini_raft = { git = "https://github.com/OscillatingBlock/raft-core.git" }
config = "0.15.27"
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
tracing = "0.1.44"
tokio-util = { version = "0.7.20", features = ["codec"] }
serde_json = "1.0.154"
bytes = { version = "1.12.1", features = ["serde"] }
futures = "0.3.34"
bincode-next = { version = "3.1.1", features = ["serde"] }
async-trait = "0.1.92"
tracing-subscriber = { version = "0.3.23", features = ["fmt"] }
